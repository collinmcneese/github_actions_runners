name: Create and publish a Docker image

on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - VERSION
    - 'docker/**'
    - 'runner-no-dind/**'
    - 'actions-runner/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-docker-image:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    environment: publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Output Collector
        id: output-collector
        uses: collinmcneese/file-output-collector@main
        with:
          file: "./VERSION"

      - name: Prep
        run: |
          echo Building with Runner version ${{ steps.output-collector.outputs.output }}
          echo ${{ steps.output-collector.outputs.output }} | grep 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta-docker
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build Docker image
        id: build-docker
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./docker
          push: true
          provenance: false
          labels: ${{ steps.meta-docker.outputs.labels }}
          platforms: ${{ matrix.platform }}
          build-args: |
            RUNNER_VERSION=${{ steps.output-collector.outputs.output }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}

      - name: debug build
        env:
          METADATA: ${{ steps.build-docker.outputs.metadata }}
        run: |
          echo "digest: ${{ steps.build-docker.outputs.digest }}"
          echo "metadata: $METADATA"
          echo "imageid: ${{ steps.build-docker.outputs.imageid }}"

  build-actions-runner-image:
    env:
      IMAGE_NAME: collinmcneese/actions-runner
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    environment: publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Output Collector
        id: output-collector
        uses: collinmcneese/file-output-collector@main
        with:
          file: "./VERSION"

      - name: Prep
        run: |
          echo Building with Runner version ${{ steps.output-collector.outputs.output }}
          echo ${{ steps.output-collector.outputs.output }} | grep 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta-docker
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build Docker image
        id: build-docker
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./actions-runner
          push: true
          provenance: false
          labels: ${{ steps.meta-docker.outputs.labels }}
          platforms: ${{ matrix.platform }}
          build-args: |
            RUNNER_VERSION=${{ steps.output-collector.outputs.output }}
            RUNNER_CONTAINER_HOOKS_VERSION=0.6.1
            DOCKER_VERSION=27.1.1
            BUILDX_VERSION=0.16.2
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}

      - name: debug build
        env:
          METADATA: ${{ steps.build-docker.outputs.metadata }}
        run: |
          echo "digest: ${{ steps.build-docker.outputs.digest }}"
          echo "metadata: $METADATA"
          echo "imageid: ${{ steps.build-docker.outputs.imageid }}"

  build-runner-no-dind-image:
    env:
      IMAGE_NAME: collinmcneese/runner-no-dind
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    environment: publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Output Collector
        id: output-collector
        uses: collinmcneese/file-output-collector@main
        with:
          file: "./VERSION"

      - name: Prep
        run: |
          echo Building with Runner version ${{ steps.output-collector.outputs.output }}
          echo ${{ steps.output-collector.outputs.output }} | grep 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta-docker
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build Docker image
        id: build-docker
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./runner-no-dind
          push: true
          provenance: false
          labels: ${{ steps.meta-docker.outputs.labels }}
          platforms: ${{ matrix.platform }}
          build-args: |
            RUNNER_VERSION=${{ steps.output-collector.outputs.output }}
            RUNNER_CONTAINER_HOOKS_VERSION=0.6.1
            DOCKER_VERSION=27.1.1
            BUILDX_VERSION=0.16.2
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}

      - name: debug build
        env:
          METADATA: ${{ steps.build-docker.outputs.metadata }}
        run: |
          echo "digest: ${{ steps.build-docker.outputs.digest }}"
          echo "metadata: $METADATA"
          echo "imageid: ${{ steps.build-docker.outputs.imageid }}"

  publish-multiarch-images:
    needs:
      - build-docker-image
      - build-actions-runner-image
      - build-runner-no-dind-image
    runs-on: ubuntu-24.04
    environment: publish
    strategy:
      matrix:
        include:
          - image: collinmcneese/github_actions_runners
          - image: collinmcneese/actions-runner
          - image: collinmcneese/runner-no-dind
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Output Collector
        id: output-collector
        uses: collinmcneese/file-output-collector@main
        with:
          file: "./VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-platform manifest
        id: manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          VERSION: ${{ steps.output-collector.outputs.output }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}:build-${{ github.run_id }}-${{ github.run_attempt }}-amd64" \
            "${IMAGE}:build-${{ github.run_id }}-${{ github.run_attempt }}-arm64"
          digest="$(docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" | sha256sum | cut -d ' ' -f 1)"
          echo "digest=sha256:${digest}" >> "$GITHUB_OUTPUT"

      - name: docker - Build Attestation
        continue-on-error: true
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: "${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.output-collector.outputs.output }}"
          subject-digest: "${{ steps.manifest.outputs.digest }}"
          push-to-registry: true
